services:
  db:
    image: postgres:17
    container_name: carvault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carvault_dev}
      POSTGRES_DB: ${POSTGRES_DB:-car_rental_db}
    # 5433 on the host because Homebrew Postgres already owns 5432 on this Mac;
    # 127.0.0.1 keeps the dev password off the local network
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
